title: "Jason Jung"
subtitle: "CPA · R&D Director at Zenterprize"
description: "Tax, Tech, Markets, and Notes"
url: "https://risingdream.github.io"
baseurl: ""

# 도메인 연결 후 아래로 변경
# url: "https://jasonjung.kr"

author:
  name: "Jason Jung"
  bio: "CPA · CFA L3 | R&D Director at Zenterprize"
  location: "Seoul, Korea"

# 테마
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "air"

# 플러그인
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist
  - jekyll-remote-theme
  - jekyll-include-cache

# 포스트 기본값
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# 카테고리
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

locale: "en"
timezone: Asia/Seoul

include:
  - _pages

sass:
  sass_dir: _sass
  style: compressed

markdown: kramdown
highlighter: rouge

title: "Jason Jung"
subtitle: "CPA · 지엔터프라이즈 대표"
description: "세무, 기술, 그리고 생각들"
url: "https://risingdream.github.io"
baseurl: ""

# 도메인 연결 후 아래로 변경
# url: "https://jasonjung.kr"

author:
  name: "Jason Jung"
  bio: "공인회계사 | 지엔터프라이즈 대표"
  location: "Seoul, Korea"

# 테마
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default" # air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

# 플러그인
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist

# 포스트 기본값
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# 카테고리
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# 한국어
locale: "ko-KR"
timezone: Asia/Seoul

# 내비게이션
header:
  overlay_color: "#1a1a2e"

# Sass
sass:
  sass_dir: _sass
  style: compressed

# 빌드
markdown: kramdown
highlighter: rouge
